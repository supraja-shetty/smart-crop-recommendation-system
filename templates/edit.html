<!DOCTYPE html>
<html>
<head>
    <title>Edit Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h3 class="text-success text-center">✏️ Edit Prediction</h3>

        <form method="post" action="/update/{{ data.id }}">

            <input class="form-control mb-2" name="n" value="{{ data.n }}" required>
            <input class="form-control mb-2" name="p" value="{{ data.p }}" required>
            <input class="form-control mb-2" name="k" value="{{ data.k }}" required>

            <input class="form-control mb-2" name="temp" value="{{ data.temp }}" required>
            <input class="form-control mb-2" name="humidity" value="{{ data.humidity }}" required>
            <input class="form-control mb-2" name="ph" value="{{ data.ph }}" required>
            <input class="form-control mb-2" name="rainfall" value="{{ data.rainfall }}" required>

            <button class="btn btn-success w-100">Update</button>

        </form>

    </div>

</div>

</body>
</html>
