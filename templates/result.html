<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🌾 FULL BACKGROUND */
        body {
            margin: 0;
            padding: 0;
            background: url("static/crops/agriculture1.jpg") no-repeat center center fixed;
            background-size: cover;
        }

        /* 🌿 GREEN OVERLAY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 70, 0, 0.55);
            z-index: -1;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh;">

    <div class="card p-4 shadow text-center w-100"
         style="max-width: 500px;">

        <h2 class="text-success">🌾 Recommended Crop</h2>

        <h1 class="fw-bold text-dark">{{ crop }}</h1>

        <img src="{{ img }}?v={{ crop }}"
             class="img-fluid rounded mt-3 shadow"
             style="max-width:400px; margin:auto;">

        <div class="mt-4">

            <a href="/" class="btn btn-success">🔄 Try Again</a>

            <a href="/download/{{ pdf_file }}" class="btn btn-primary">
                📄 Download Report
            </a>

        </div>

    </div>

</div>

</body>
</html>
