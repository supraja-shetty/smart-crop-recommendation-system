<!DOCTYPE html>
<html>
<head>
    <title>Crop Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #e8f5e9, #f1f8e9);
        }

        .card {
            border-radius: 15px;
        }

        .navbar {
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-success {
            border-radius: 10px;
            font-weight: bold;
        }
    </style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand fw-bold">🌱 Smart Crop Recommendation System</span>
        <div>
            <a href="/dashboard" class="btn btn-light btn-sm">Dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- MAIN FORM -->
<div class="container mt-5">

    <div class="card p-5 shadow-lg">

        <h3 class="text-center text-success mb-4">
            🌾 Enter Soil & Weather Details
        </h3>

        <!-- IMPORTANT FIX: action="/predict" -->
        <form method="post" action="/predict">

            <div class="row mb-3">
                <div class="col">
                    <input class="form-control" name="n" placeholder="Nitrogen (N)" required>
                </div>
                <div class="col">
                    <input class="form-control" name="p" placeholder="Phosphorus (P)" required>
                </div>
                <div class="col">
                    <input class="form-control" name="k" placeholder="Potassium (K)" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <input class="form-control" name="temp" placeholder="Temperature (°C)" required>
                </div>
                <div class="col">
                    <input class="form-control" name="humidity" placeholder="Humidity (%)" required>
                </div>
                <div class="col">
                    <input class="form-control" name="ph" placeholder="pH Value" required>
                </div>
            </div>

            <div class="mb-3">
                <input class="form-control" name="rainfall" placeholder="Rainfall (mm)" required>
            </div>

            <button class="btn btn-success w-100">
                🌾 Predict Best Crop
            </button>

        </form>

    </div>

</div>

</body>
</html>
